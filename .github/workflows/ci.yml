name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # GREEN-1: tests/test_api_console*.py import fastapi, which lives in
      # the separate "api" extra, not "test". Installing test-only here
      # silently aborted collection with 6 errors, so the WHOLE suite never
      # ran in CI from 0017b3f (2026-07-12) through this fix -- not a
      # test-level importorskip, an actual missing dependency.
      - name: Install (test + api extras; mock mode needs no live deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,api]"

      - name: Compile all modules
        run: python -m compileall alphaos

      - name: Run test suite (offline, mock mode)
        run: python -m pytest

  test-clock-shift:
    name: tests clock-shift ${{ matrix.clock-shift-days }}d (date-rot detector, advisory)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Audit-fixup GROUP-A round 2: +90 ONLY missed a REAL, pre-existing
        # date-rot pair (test_benchmark_capture.py's own
        # test_bars_backfill_only_fetches_the_gap_since_last_cached_date /
        # test_bars_backfill_is_rerun_safe_via_the_unique_index -- both
        # hardcoded a "last cached date" that sits in the FUTURE relative to
        # a -90d "today", tripping capture_benchmark_spine's own `start >
        # market_dt` early-out) -- both directions are needed, not just the
        # forward one, since a hardcoded date can just as easily be stale
        # against a PAST shift as a future one.
        clock-shift-days: [90, -90]
    # GREEN-1 defect 4 (the date-rot class fix): §H.1's hardcoded-date flake
    # has recurred many times (233c74b, 6ffbc2d, cd057ce, and the four tests
    # this spec's own GREEN-1/audit-fixup rounds re-seeded). A test that
    # hardcodes "today" instead of deriving it from timeutils.now_utc()
    # passes until the calendar rolls past its own trailing window (or, for
    # a "last known date" style fixture, until the calendar rolls far enough
    # PAST it), then goes red with no code change. Running the WHOLE suite
    # once more, today, as if N days had already passed (tests/_dateshift.py's
    # --clock-shift-days option) surfaces that class of latent failure BEFORE
    # merge instead of weeks later. Advisory (continue-on-error) -- a red run
    # here is a signal to investigate, never a merge blocker, since some
    # failures may reflect a genuinely time-bound feature (e.g. a
    # pre-registration's analysis_not_before date) rather than a bug.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (test + api extras; mock mode needs no live deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,api]"

      - name: Run test suite ${{ matrix.clock-shift-days }} days shifted (advisory)
        run: python -m pytest --clock-shift-days=${{ matrix.clock-shift-days }}

  console:
    name: console (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (build + vitest run)
        run: npm test

  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to one version (not the test matrix): mypy's `python_version`
      # setting in pyproject.toml is fixed at 3.12, and third-party stub
      # packages (e.g. numpy, pulled in transitively) can use syntax mypy
      # refuses to parse under an older target -- see [tool.mypy] in
      # pyproject.toml for the full rationale.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (test + lint extras; mypy needs the test-side types too)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"

      - name: ruff check
        run: ruff check alphaos connectors tests

      - name: mypy (loose -- see pyproject.toml [tool.mypy] for scope/baseline)
        run: mypy alphaos
